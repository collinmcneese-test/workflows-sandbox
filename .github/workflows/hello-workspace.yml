name: hello to github_workspace

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/hello-workspace.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo $GITHUB_WORKSPACE

